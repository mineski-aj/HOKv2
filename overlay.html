<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOK Top Bar Overlay</title>
    <link rel="stylesheet" href="css/1-ingame-overlay.css">
    <link rel="stylesheet" href="css/2-kill-player.css">
    <link rel="stylesheet" href="css/3-objective.css">
</head>
<body>
    <div id="canvas">
        <!-- MODUL 1: TOP BAR IN-GAME -->
        <div id="top-bar">
            <img src="assets/images/1-ingame-overlay/box-atas.png" class="bg-img" alt="">
            
            <div class="text score" id="home-score">0</div>
            <img class="logo" id="home-logo" src="">
            <div class="team-abbr-ingame" id="home-abbr-ingame"></div>
            <div class="text stats" id="home-dragon">0</div>
            <div class="text stats" id="home-tower">0</div>
            <div class="text stats" id="home-gold">0.0K</div>
            <div class="text diff" id="home-diff">+ 0.0K</div>
            <div class="text kill" id="home-kill">0</div>

            <div class="text timer" id="timer">00:00</div>

            <div class="text kill" id="away-kill">0</div>
            <div class="text stats" id="away-gold">0.0K</div>
            <div class="text diff" id="away-diff">+ 0.0K</div>
            <div class="text stats" id="away-tower">0</div>
            <div class="text stats" id="away-dragon">0</div>
            <img class="logo" id="away-logo" src="">
            <div class="team-abbr-ingame" id="away-abbr-ingame"></div>
            <div class="text score" id="away-score">0</div>
        </div>

        <!-- MODUL 2: KILL PLAYER (First Blood - ACE) -->
        <div id="kp-container">
            <video id="kp-vid" src="" muted></video>
            
            <div id="kp-multi-box">
                <img id="kp-multi-photo" src="">
                <img id="kp-multi-logo" src="">
                <div id="kp-multi-name">PLAYER</div>
            </div>

            <div id="kp-ace-box">
                <img id="kp-ace-logo" src="">
                <div id="kp-ace-name">TEAM NAME</div>
            </div>
        </div>

        <!-- MODUL 3: OBJECTIVE (Tyrant, Overlord, dll) -->
        <div id="obj-container">
            <video id="obj-vid" src="" muted></video>
            
            <div id="obj-epic-box">
                <img id="obj-epic-photo" src="">
                <img id="obj-epic-logo" src="">
                <div id="obj-epic-name">PLAYER</div>
            </div>

            <div id="obj-reg-box">
                <img id="obj-reg-photo" src="">
                <img id="obj-reg-logo" src="">
                <div id="obj-reg-name">PLAYER</div>
            </div>
        </div>
    </div>

    <script src="js/1-ingame-overlay.js"></script>
    <script src="js/2-kill-player.js"></script>
    <script src="js/3-objective.js"></script>
</body>
</html>
